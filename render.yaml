services:
  # BACKEND SERVICE (FastAPI)
  - type: web
    name: pymentor-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GROQ_API_KEY
        sync: false   # Paste your API key in the Render dashboard
      - key: MODEL
        value: "llama-3.3-70b-versatile"
      - key: MAX_TOKENS
        value: "4096"
      - key: TEMPERATURE
        value: "0.7"
      - key: CORS_ORIGINS
        sync: false   # Set to: https://YOUR_GITHUB_USERNAME.github.io
